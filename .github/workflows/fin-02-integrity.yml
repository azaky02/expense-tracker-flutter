name: FIN-02 Balance and Transfer Integrity

on:
  push:
    branches:
      - audit/fin-02-balances-transfers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance-transfer-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze FIN-02 changes
        run: flutter analyze lib/core/sync/sync_service.dart lib/features/transactions/data/transaction_repository.dart lib/features/transactions/presentation/add_transaction_screen.dart test/fin_02_balance_transfer_test.dart
      - name: Run FIN-02 isolated regression tests
        run: flutter test test/fin_02_balance_transfer_test.dart --reporter expanded
