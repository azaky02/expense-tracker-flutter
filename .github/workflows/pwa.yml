# Builds the PWA (Flutter web) and publishes it on GitHub Pages:
#   https://azaky02.github.io/expense-tracker-flutter/
# Runs on every push to master that touches the app, or by hand from the Actions tab.
name: PWA (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['lib/**', 'web/**', 'assets/**', 'pubspec.yaml', '.github/workflows/pwa.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Release code (date + time)
        run: |
          echo "STAMP=$(TZ=Africa/Cairo date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release --base-href /expense-tracker-flutter/ \
            --dart-define=RELEASE_CODE="$STAMP" --dart-define=APP_VERSION="$NAME"
          # Deep links such as /expense-tracker-flutter/#/stats work; 404.html covers others.
          cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
