name: People WhatsApp Share
on:
  push:
    branches:
      - feature/people-whatsapp-share
      - fix/people-whatsapp-message-balance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whatsapp-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
      - run: flutter pub get
      - run: flutter analyze lib/features/people/data/ledger_repository.dart lib/features/people/presentation/person_form_screen.dart lib/features/people/presentation/ledger_entry_form_screen.dart test/people_whatsapp_share_test.dart lib/features/people/presentation/whatsapp_message.dart test/people_whatsapp_message_test.dart
      - run: flutter test test/people_whatsapp_share_test.dart test/people_whatsapp_message_test.dart --reporter expanded
