name: Android trial APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/android-trial.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Regression tests
        run: |
          flutter test test/fin_01_installment_idempotency_test.dart --reporter expanded
          flutter test test/fin_02_balance_transfer_test.dart --reporter expanded
          flutter test test/people_whatsapp_share_test.dart --reporter expanded
      - name: Build installable trial APK (debug signing)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Masarefy-master-trial-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
