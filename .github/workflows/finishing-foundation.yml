name: Finishing Foundation Validation

on:
  push:
    branches:
      - feature/finishing-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finishing-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze lib/features/accounts/data/account_repository.dart lib/core/db/database.dart lib/core/db/finishing_schema_v9.dart lib/features/finishing/domain/finishing_financial_rules.dart lib/features/finishing/data/finishing_pending_event_repository.dart lib/features/finishing/data/finishing_posting_preflight.dart lib/features/finishing/data/finishing_local_cost_posting.dart test/finishing_pending_event_repository_test.dart test/finishing_account_balance_test.dart test/finishing_local_cost_posting_test.dart test/finishing_schema_v9_test.dart test/finishing_financial_rules_test.dart
      - name: Finishing schema and accounting tests
        run: flutter test test/finishing_local_cost_posting_test.dart test/finishing_account_balance_test.dart test/finishing_schema_v9_test.dart test/finishing_financial_rules_test.dart test/finishing_pending_event_repository_test.dart --reporter expanded
