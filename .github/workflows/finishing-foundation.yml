name: Finishing Foundation Validation

on:
  push:
    branches:
      - feature/finishing-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finishing-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze lib/features/accounts/data/account_repository.dart lib/core/db/database.dart lib/core/db/finishing_schema_v9.dart lib/features/finishing/domain/finishing_financial_rules.dart lib/features/finishing/data/finishing_pending_event_repository.dart lib/features/finishing/data/finishing_posting_preflight.dart lib/features/finishing/data/finishing_local_cost_posting.dart test/finishing_pending_event_repository_test.dart test/finishing_account_balance_test.dart test/finishing_local_cost_posting_test.dart test/finishing_schema_v9_test.dart test/finishing_financial_rules_test.dart
      - name: Finishing schema and accounting tests
        run: flutter test test/finishing_local_cost_posting_test.dart test/finishing_account_balance_test.dart test/finishing_schema_v9_test.dart test/finishing_financial_rules_test.dart test/finishing_pending_event_repository_test.dart --reporter expanded

  finishing-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finishing_test
          POSTGRES_PASSWORD: finishing_test
          POSTGRES_DB: finishing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finishing_test -d finishing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINISHING_TEST_DATABASE_URL: postgres://finishing_test:finishing_test@localhost:5432/finishing_test
      TEST_DATABASE_URL: postgres://finishing_test:finishing_test@localhost:5432/finishing_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck server
        run: npm run typecheck
      - name: Run server unit tests
        run: npm test
