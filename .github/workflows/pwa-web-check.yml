name: Flutter Web compatibility check
on:
  workflow_dispatch:
  push:
    branches: [feature/pwa]
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web scaffold if missing
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name expense_tracker_flutter .
          fi
      - run: flutter pub get
      - name: Build web to identify incompatibilities
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: masarefy-web-build
          path: build/web/
